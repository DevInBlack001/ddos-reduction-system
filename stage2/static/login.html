<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (function () {
            var t = localStorage.getItem('shield-theme');
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <title>Shield Gateway - Sign In</title>
    <link rel="stylesheet" href="/static/base.css">
    <style>
        body {
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .theme-toggle-corner {
            position: fixed;
            top: 20px;
            right: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            margin: 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 32px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-logo {
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            background-color: var(--accent);
            color: var(--text-on-accent);
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px auto;
        }
        .login-title {
            color: var(--text-primary);
            font-size: 1.15rem;
            font-weight: 600;
        }
        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.82rem;
            margin-top: 6px;
        }
        .error-message {
            color: var(--status-danger);
            background-color: var(--status-danger-bg);
            border: 1px solid var(--status-danger);
            border-radius: var(--radius-sm);
            padding: 10px;
            font-size: 0.82rem;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <button id="themeToggle" class="theme-toggle theme-toggle-corner"></button>

    <div class="login-box">
        <div class="login-header">
            <div class="login-logo">S</div>
            <div class="login-title">Shield Gateway</div>
            <div class="login-subtitle">Please sign in to continue</div>
        </div>

        <div id="errorBox" class="error-message"></div>

        <form id="loginForm">
            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Username</label>
                <input type="text" id="username" class="form-input" placeholder="Username" required autofocus>
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Password</label>
                <input type="password" id="password" class="form-input" placeholder="Password" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Sign In</button>
        </form>
    </div>

    <script src="/static/theme.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const errBox = document.getElementById("errorBox");

            errBox.style.display = "none";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams({ username, password })
                });

                if (response.ok) {
                    window.location.href = "/";
                } else {
                    const data = await response.json();
                    errBox.innerText = data.detail || "Invalid username or password.";
                    errBox.style.display = "block";
                }
            } catch (err) {
                errBox.innerText = "Network error while connecting to the gateway.";
                errBox.style.display = "block";
            }
        });
    </script>
</body>
</html>
