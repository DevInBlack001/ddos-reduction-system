<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (function () {
            var t = localStorage.getItem('flod-theme');
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
            var d = localStorage.getItem('flod-design') || 'operations';
            document.documentElement.setAttribute('data-design', d);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <title>FLOD System - Sign In</title>
    <link rel="stylesheet" href="/static/base.css">
    <style>
        body {
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .theme-toggle-corner {
            position: fixed;
            top: 20px;
            right: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            margin: 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 32px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-logo {
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            background-color: var(--accent);
            color: var(--text-on-accent);
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px auto;
        }
        .login-title {
            color: var(--text-primary);
            font-size: 1.15rem;
            font-weight: 600;
        }
        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.82rem;
            margin-top: 6px;
        }
        .error-message {
            color: var(--status-danger);
            background-color: var(--status-danger-bg);
            border: 1px solid var(--status-danger);
            border-radius: var(--radius-sm);
            padding: 10px;
            font-size: 0.82rem;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        /* FLOD, literally: a flood held back at the front door. Two
           overlapping wave layers pinned to the bottom of the viewport,
           behind the login card, drifting in a seamless loop. Colour
           comes from --accent so it reads correctly in all three design
           families without its own per-theme values. Off entirely for
           the Security Terminal family (sharp, no-motion by definition,
           see base.css) and for prefers-reduced-motion. */
        .flood-waves {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 22vh;
            min-height: 140px;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        .flood-wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
        }
        .flood-wave-back {
            fill: var(--accent);
            opacity: 0.08;
            animation: flood-drift 9s linear infinite;
        }
        .flood-wave-front {
            fill: var(--accent);
            opacity: 0.14;
            animation: flood-drift 5.5s linear infinite reverse;
        }
        @keyframes flood-drift {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        [data-design="terminal"] .flood-waves {
            display: none;
        }
        @media (prefers-reduced-motion: reduce) {
            .flood-wave-back, .flood-wave-front {
                animation: none;
            }
        }
        .login-box {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="flood-waves" aria-hidden="true">
        <svg class="flood-wave flood-wave-back" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,50 C150,20 350,80 600,55 C850,30 1050,70 1200,45 L1200,120 L0,120 Z"></path>
            <path d="M1200,50 C1350,20 1550,80 1800,55 C2050,30 2250,70 2400,45 L2400,120 L1200,120 Z"></path>
        </svg>
        <svg class="flood-wave flood-wave-front" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,70 C200,95 400,45 650,65 C900,85 1050,40 1200,60 L1200,120 L0,120 Z"></path>
            <path d="M1200,70 C1400,95 1600,45 1850,65 C2100,85 2250,40 2400,60 L2400,120 L1200,120 Z"></path>
        </svg>
    </div>

    <button id="themeToggle" class="theme-toggle theme-toggle-corner"></button>

    <div class="login-box">
        <div class="login-header">
            <div class="login-logo"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" aria-hidden="true"><circle cx="5" cy="12" r="2.2" stroke="var(--text-on-accent)" stroke-width="1.5"/><circle cx="19" cy="12" r="2.2" stroke="var(--text-on-accent)" stroke-width="1.5"/><line x1="7.2" y1="12" x2="9.5" y2="12" stroke="var(--text-on-accent)" stroke-width="1.5"/><line x1="14.5" y1="12" x2="16.8" y2="12" stroke="var(--text-on-accent)" stroke-width="1.5"/><path d="M9.5 8 L12.5 12 L9.5 16 M12.5 8 L15.5 12 L12.5 16" stroke="var(--text-on-accent)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="login-title">FLOD System</div>
            <div class="login-subtitle">Please sign in to continue</div>
        </div>

        <div id="errorBox" class="error-message"></div>

        <form id="loginForm">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-input" placeholder="Username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="Password" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Sign In</button>
        </form>
    </div>

    <script src="/static/theme.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const errBox = document.getElementById("errorBox");

            errBox.style.display = "none";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams({ username, password })
                });

                if (response.ok) {
                    window.location.href = "/";
                } else {
                    const data = await response.json();
                    errBox.innerText = data.detail || "Invalid username or password.";
                    errBox.style.display = "block";
                }
            } catch (err) {
                errBox.innerText = "Network error while connecting to the gateway.";
                errBox.style.display = "block";
            }
        });
    </script>
</body>
</html>
