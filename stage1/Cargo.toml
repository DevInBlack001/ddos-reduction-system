[package]
name    = "ddos_stage1"
version = "1.0.2"
edition = "2024"
authors = ["Abdullah Armiyao"]
description = "FLOD System Stage 1: packet capture, statistical analysis, and anomaly detection"

# ==============================================================================
# Build profile optimisations
# Release builds use maximum LTO + single codegen unit for smallest, fastest binary.
# Debug builds keep full symbols for easy gdb/perf inspection.
# ==============================================================================
[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"   # drop unwinding runtime in production binary

[profile.dev]
opt-level = 0
debug     = true

# ==============================================================================
# Dependencies
# All external crates are pinned to a minimum compatible version.
#
#   pcap           : Rust binding to system libpcap for raw frame ingestion
#   etherparse     : zero-copy Ethernet/IP/TCP/UDP packet header parser
#   crossbeam-channel: bounded, lock-minimised MPSC channel between threads
#   byteorder      : explicit endian-aware byte serialisation for the IPC struct
#   log + env_logger: levelled logging without pulling in a heavy async runtime
#   serde + serde_json: (de)serialise the V4 baseline-persistence file
#                     (nested per-victim map, variable victim count, a
#                     better fit for JSON's flexibility than the IPC
#                     struct's fixed layout, which stays hand-rolled).
# ==============================================================================
[dependencies]
pcap              = "2"
etherparse        = "0.15"
crossbeam-channel = "0.5"
byteorder         = "1"
log               = "0.4"
env_logger        = "0.11"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
# Loads and attaches the XDP and TC programs, and reads their maps. The object
# itself is built separately by scripts/build-ebpf.sh and loaded at runtime, so
# the sensor still compiles on a machine with no eBPF toolchain.
aya               = "0.14"
ddos-stage1-common = { path = "../stage1-common", features = ["user"] }
